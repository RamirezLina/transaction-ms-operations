spring.application.name=ms-operations
server.port=8081


# Configuración de MySQL
spring.datasource.url=${MYSQL_CONNECTION_STRING}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuración RabbitMQ Conexión asíncrona con ms-users
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# URL base para el cliente de usuarios
client.users.url=${CLIENT_USERS_URL}


app.exchange=accounts.direct
app.routing=account.create
app.queue=operations.accounts

